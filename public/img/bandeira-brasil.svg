<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
<defs>
  <!-- Ondulação do tecido: ruído + deslocamento. Como isto entra via CSS
       background-image, o navegador rasteriza uma vez só (não custa por quadro). -->
  <filter id="ondas" x="-12%" y="-12%" width="124%" height="124%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0055 0.011" numOctaves="3" seed="11" result="ruido"/>
    <feDisplacementMap in="SourceGraphic" in2="ruido" scale="62" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <!-- Vincos: faixas claras e escuras alternadas, como luz batendo no pano -->
  <linearGradient id="vincos" x1="0" y1="0" x2="1" y2="0.28">
    <stop offset="0.00" stop-color="#000" stop-opacity="0.22"/>
    <stop offset="0.07" stop-color="#fff" stop-opacity="0.20"/>
    <stop offset="0.15" stop-color="#000" stop-opacity="0.18"/>
    <stop offset="0.24" stop-color="#fff" stop-opacity="0.16"/>
    <stop offset="0.33" stop-color="#000" stop-opacity="0.20"/>
    <stop offset="0.43" stop-color="#fff" stop-opacity="0.22"/>
    <stop offset="0.52" stop-color="#000" stop-opacity="0.20"/>
    <stop offset="0.62" stop-color="#fff" stop-opacity="0.18"/>
    <stop offset="0.71" stop-color="#000" stop-opacity="0.20"/>
    <stop offset="0.81" stop-color="#fff" stop-opacity="0.14"/>
    <stop offset="0.90" stop-color="#000" stop-opacity="0.19"/>
    <stop offset="1.00" stop-color="#000" stop-opacity="0.24"/>
  </linearGradient>
  <radialGradient id="brilhoGlobo" cx="0.36" cy="0.30" r="0.85">
    <stop offset="0" stop-color="#3A63C8"/>
    <stop offset="1" stop-color="#12276B"/>
  </radialGradient>
  <linearGradient id="campoVerde" x1="0" y1="0" x2="0.7" y2="1">
    <stop offset="0" stop-color="#12803B"/>
    <stop offset="1" stop-color="#0B5F2B"/>
  </linearGradient>
  <linearGradient id="losango" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#F2C40C"/>
    <stop offset="1" stop-color="#C79E06"/>
  </linearGradient>
  <clipPath id="cortaGlobo"><circle cx="500" cy="350" r="175"/></clipPath>
</defs>

